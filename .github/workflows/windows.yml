name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure native x64 build
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test command-line behavior
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package experimental application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item build/Release/*.exe, build/Release/TidyDeskTap.dll, LICENSE, README.md -Destination package
          Copy-Item blank.ico -Destination package
          Copy-Item build/settings-*.png -Destination package
          Get-ChildItem package -File | Where-Object Extension -in '.exe','.dll' | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content package/SHA256SUMS.txt
      - name: Build per-user installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
      - name: Test installation and uninstall
        shell: pwsh
        run: |
          $testInstall = Join-Path $env:RUNNER_TEMP 'TidyDesk-install-test'
          $setup = (Resolve-Path package/TidyDesk-0.4.3-Setup.exe).Path
          $setupProcess = Start-Process $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=',"/DIR=`"$testInstall`"") -WindowStyle Hidden -PassThru -Wait
          if ($setupProcess.ExitCode -ne 0) { throw "Install failed: $($setupProcess.ExitCode)" }
          if (!(Test-Path "$testInstall/0.4.3/TidyDesk.exe")) { throw 'Installed application missing' }
          $uninstallKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{F33B8E61-F180-40F4-9377-455BBBCE67A1}_is1'
          if (!(Test-Path $uninstallKey)) { throw 'Uninstall registration missing' }
          $menuKey = 'HKCU:\Software\Classes\DesktopBackground\Shell\TidyDesk.New'
          if (!(Test-Path $menuKey)) { throw 'Desktop new-collection menu missing' }
          $shortcut = Join-Path ([Environment]::GetFolderPath('StartMenu')) 'Programs/TidyDesk/TidyDesk.lnk'
          if (!(Test-Path $shortcut)) { throw 'Start menu shortcut missing' }
          $uninstallProcess = Start-Process "$testInstall/unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -WindowStyle Hidden -PassThru -Wait
          if ($uninstallProcess.ExitCode -ne 0) { throw 'Uninstall failed' }
          if (Test-Path "$testInstall/0.4.3/TidyDesk.exe") { throw 'Application remained after uninstall' }
          if (Test-Path $uninstallKey) { throw 'Uninstall registration remained' }
          if (Test-Path $menuKey) { throw 'Desktop menu remained after uninstall' }
          if (Test-Path $shortcut) { throw 'Start menu shortcut remained' }
          Get-FileHash $setup -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content package/INSTALLER-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TidyDesk-experimental-windows-x64
          path: package/
          if-no-files-found: error
          retention-days: 14

